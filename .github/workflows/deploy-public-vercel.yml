# Optional: deploy the public docs/ snapshot to Vercel (Combo A public plane).
#
# Operator prerequisites (GitHub repo Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN      — Vercel account token (Account Settings → Tokens)
#   VERCEL_ORG_ID     — Team or personal ID from the Vercel project settings
#   VERCEL_PROJECT_ID — Project ID from the Vercel project settings
#
# Vercel project setup:
#   - Import this repository as a new project.
#   - Root Directory = docs  (NOT web/ — do not deploy the Next.js app)
#   - Framework Preset = Other (static site; no build command)
#
# If secrets are missing or the token is invalid/expired, deploy is skipped (or
# warned) and the workflow succeeds — public snapshot deploy is optional.

name: deploy-public-vercel

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy-public-vercel
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy docs/ snapshot to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel secrets
        id: secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Vercel deploy skipped::Configure VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID in repository secrets. Create a Vercel project with Root Directory=docs (static snapshot only; not web/)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy static docs snapshot to Vercel
        id: deploy
        if: steps.secrets.outputs.configured == 'true'
        continue-on-error: true
        uses: amondnet/vercel-action@v25.2.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./docs
          vercel-args: "--prod"
          # Action default pins ancient CLI; API now requires >=47.2.2
          vercel-version: latest

      - name: Surface optional deploy failure
        if: steps.secrets.outputs.configured == 'true' && steps.deploy.outcome != 'success'
        run: |
          echo "::warning title=Vercel deploy failed::Public snapshot deploy is optional. If the log says the token is not valid, rotate it (Vercel → Account Settings → Tokens) and run: gh secret set VERCEL_TOKEN"
