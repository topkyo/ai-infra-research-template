# Public snapshot is NOT deployed from git.
# Combo A source of truth: VPS host docs/data/*.json via
#   ./scripts/vps-refresh-public-snapshot.sh
#   ./scripts/deploy-public-snapshot.sh
#
# This workflow only exists so old bookmarks / "Re-run workflow" show a clear error
# instead of silently publishing an empty or stale tree after docs/data was untracked.

name: deploy-public-vercel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-public-vercel
  cancel-in-progress: true

jobs:
  remind:
    name: Refuse git-based public deploy
    runs-on: ubuntu-latest
    steps:
      - name: Point operators at VPS CLI
        run: |
          echo "::error title=Public snapshot is CLI-only::Do not deploy docs/ from GitHub Actions. On the VPS: ./scripts/vps-refresh-public-snapshot.sh (or SNAPSHOT_SKIP_* + ./scripts/deploy-public-snapshot.sh). Snapshot JSON is gitignored; see docs/specs/2026-08-06-public-snapshot-source-of-truth.md"
          exit 1
