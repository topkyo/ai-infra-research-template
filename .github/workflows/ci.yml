name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------
  # Next.js webapp: type-check, unit tests, production build.
  # ----------------------------------------------------------------------
  web:
    name: web (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Dependency audit (high+)
        continue-on-error: true
        run: |
          if ! npm audit --audit-level=high; then
            echo "::warning title=npm audit::High-severity vulnerabilities remain in transitive deps (postcss/sharp via next@15). Fix requires next@16 — tracked as residual audit debt."
            exit 1
          fi

      - name: Type-check
        run: ./node_modules/.bin/tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        # The build doesn't need real secrets — env vars are read at runtime,
        # and the universe JSON + cache.db live on the runtime filesystem.
        env:
          DEEPSEEK_API_KEY: dummy-ci-key
        run: npm run build

  # ----------------------------------------------------------------------
  # Python sidecar: syntax + import check + unit tests. Tests are offline by
  # design (no Tushare/akshare network calls — those are flaky upstream).
  # ----------------------------------------------------------------------
  pyserver:
    name: pyserver (syntax + import + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pyserver
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyserver/uv.lock

      - name: Sync dependencies (locked)
        run: uv sync --frozen

      - name: Syntax check
        run: uv run python -m py_compile main.py

      - name: Import check
        # Confirms fastapi/tushare/pandas/pydantic all resolve and main.py
        # imports without executing network I/O. ts.set_token just writes
        # ~/.tushare/token; no validation happens until an actual API call.
        env:
          TUSHARE_TOKEN: dummy-ci-token
        run: uv run python -c "import importlib.util as u; spec = u.spec_from_file_location('m','main.py'); m = u.module_from_spec(spec); spec.loader.exec_module(m); print('main loaded, app =', m.app)"

      - name: Unit tests
        env:
          TUSHARE_TOKEN: dummy-ci-token
        run: uv run python -m unittest discover -p "test_*.py"

  # ----------------------------------------------------------------------
  # End-to-end smoke: Playwright drives chromium against a local stack —
  # pyserver in MOCK mode + Next.js dev server (LLM_PROVIDER=mock).
  # ----------------------------------------------------------------------
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyserver/uv.lock

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Sync pyserver dependencies (locked)
        working-directory: pyserver
        run: uv sync --frozen

      - name: Install chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run e2e
        working-directory: web
        run: npm run test:e2e

  # ----------------------------------------------------------------------
  # Docker image builds: validates the production build path (incl.
  # better-sqlite3 native module on the slim image) for both services.
  # ----------------------------------------------------------------------
  docker:
    name: docker (image builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build pyserver image
        run: docker build -t topkyo-pyserver-ci ./pyserver

      - name: Smoke-test pyserver imports inside the image
        # Catches missing COPY directives (e.g. a new module extracted from
        # main.py but not listed in Dockerfile COPY) that docker build alone
        # cannot detect — the image builds fine, but uvicorn would crash with
        # ModuleNotFoundError on startup.
        run: docker run --rm --env TUSHARE_TOKEN=dummy topkyo-pyserver-ci python -c "import cache, validation, analyst, main; print('pyserver imports OK')"

      - name: Build web image
        run: docker build -t topkyo-web-ci ./web

      - name: Smoke-test web native modules inside the image
        # Verifies better-sqlite3's native binding loads on node:24-slim
        # (prebuilt binary must exist for the Node ABI in the image).
        run: docker run --rm topkyo-web-ci node -e "const Database=require('better-sqlite3'); const db=new Database(':memory:'); db.exec('create table t(a)'); db.prepare('insert into t values(?)').run(1); console.log('better-sqlite3 OK', db.prepare('select a from t').get())"
