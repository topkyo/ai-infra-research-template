# Both services run as uid 1001 (user app). Bind mounts and named volumes must be
# writable by that uid — see docs/DEPLOY.md §3 and private/README.md.
services:
  pyserver:
    restart: unless-stopped
    build:
      context: ./pyserver
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8001:8001"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: Asia/Shanghai
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      PYSERVER_CACHE_DB: /app/cache-data/cache.db
    volumes:
      # Named volume: first compose up seeds ownership from image /app/cache-data (uid 1001).
      - pyserver-cache:/app/cache-data
    healthcheck:
      # python:3.13-slim has no curl/wget; use stdlib urllib.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    restart: unless-stopped
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # Directory mounts so atomic tmp+rename updates the host inode.
      # Single-file binds break rename (EBUSY / stale host file).
      # Host dirs must be writable by container uid 1001 (see docs/DEPLOY.md §3).
      - ./web/data:/app/data
      - ./private:/app/private
      # Named volume: first compose up seeds ownership from image /app/.cache (uid 1001).
      - web-cache:/app/.cache
    environment:
      TZ: Asia/Shanghai
      # Writable dir mount (not a single-file bind) for holdings atomic writes.
      HOLDINGS_FILE: /app/private/holdings.local.json
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      OPENCODE_GO_BASE_URL: ${OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/go/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      LLM_MODEL_BACKTEST: ${LLM_MODEL_BACKTEST:-deepseek-v4-flash}
      LLM_SCORE_BATCH_SIZE: ${LLM_SCORE_BATCH_SIZE:-10}
      SIGNALS_LLM_TIMEOUT_MS: ${SIGNALS_LLM_TIMEOUT_MS:-900000}
      SIGNALS_LLM_SCORE_BATCH_SIZE: ${SIGNALS_LLM_SCORE_BATCH_SIZE:-10}
      SIGNALS_LOAD_CONCURRENCY: ${SIGNALS_LOAD_CONCURRENCY:-3}
      SIGNALS_PYSERVER_TIMEOUT_MS: ${SIGNALS_PYSERVER_TIMEOUT_MS:-120000}
      BACKTEST_SIGNAL_CONCURRENCY: ${BACKTEST_SIGNAL_CONCURRENCY:-8}
      BACKTEST_LLM_SCORE_BATCH_SIZE: ${BACKTEST_LLM_SCORE_BATCH_SIZE:-10}
      BACKTEST_LLM_TIMEOUT_MS: ${BACKTEST_LLM_TIMEOUT_MS:-300000}
      BACKTEST_LLM_MAX_ATTEMPTS: ${BACKTEST_LLM_MAX_ATTEMPTS:-2}
      BACKTEST_LOAD_CONCURRENCY: ${BACKTEST_LOAD_CONCURRENCY:-10}
      BACKTEST_PYSERVER_TIMEOUT_MS: ${BACKTEST_PYSERVER_TIMEOUT_MS:-60000}
      UNIVERSE_REFRESH_LLM_TIMEOUT_MS: ${UNIVERSE_REFRESH_LLM_TIMEOUT_MS:-900000}
      UNIVERSE_REFRESH_VALIDATE_TIMEOUT_MS: ${UNIVERSE_REFRESH_VALIDATE_TIMEOUT_MS:-20000}
      # data/ bind-mounted: UI 刷新持久化到宿主机。设为 0 可临时冻结。
      # Access is network-level (127.0.0.1 / SSH tunnel; Mode A: Caddy Basic Auth).
      UNIVERSE_REFRESH_ENABLED: ${UNIVERSE_REFRESH_ENABLED:-1}
      PYSERVER_URL: http://pyserver:8001
    depends_on:
      pyserver:
        condition: service_healthy
    healthcheck:
      # node:24-slim has no curl/wget; Node 24 ships global fetch.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pyserver-cache:
  web-cache:
